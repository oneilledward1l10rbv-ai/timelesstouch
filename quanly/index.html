<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>TimelessTouch · Quản lý kho</title>
<meta name="theme-color" content="#1F1813">
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231F1813'/%3E%3Ccircle cx='32' cy='32' r='19' fill='none' stroke='%23C9A46A' stroke-width='4'/%3E%3Cpath d='M32 20v13l8 5' stroke='%23C9A46A' stroke-width='4' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Cormorant+Garamond:wght@500;600;700&display=swap">
<style>
:root{
  --bg:#F6F2EA; --surface:#FFFDF9; --sunk:#EFE9DE; --line:#E4DBCC; --line-2:#D2C6B2;
  --ink:#231C14; --muted:#6E6253; --faint:#9A8E7E;
  --side:#1F1813; --side-2:#2C231C; --side-ink:#D9CCB9;
  --brass:#B08A4F; --brass-ink:#7A5A26; --brass-soft:#F3EAD9;
  --accent:#33271D; --accent-ink:#FFF8EE;
  --pos:#2E7350; --pos-soft:#E2F0E7; --neg:#B23A2C; --neg-soft:#F8E3DF;
  --warn:#946200; --warn-soft:#FAEFD6; --info:#2F5E8A; --info-soft:#E2ECF6; --idle:#6F6A62; --idle-soft:#ECE8E1;
  --shadow:0 1px 2px rgba(35,28,20,.06),0 3px 10px rgba(35,28,20,.05);
  --f:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-brand:"Cormorant Garamond",Georgia,serif;
  --r:12px; color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#14100C; --surface:#1D1712; --sunk:#181310; --line:#33291F; --line-2:#44372A;
  --ink:#F1E8DA; --muted:#B3A591; --faint:#857867;
  --side:#0F0B08; --side-2:#211A14; --side-ink:#CDBFA9;
  --brass:#D1AC70; --brass-ink:#E0BE85; --brass-soft:#2E2416;
  --accent:#E6D3B3; --accent-ink:#1A140F;
  --pos:#62C08F; --pos-soft:#14301F; --neg:#F08C7C; --neg-soft:#3A1D18;
  --warn:#E5B653; --warn-soft:#33280F; --info:#86B3E0; --info-soft:#17283B; --idle:#A49C90; --idle-soft:#26201A;
  --shadow:0 1px 2px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#14100C; --surface:#1D1712; --sunk:#181310; --line:#33291F; --line-2:#44372A;
  --ink:#F1E8DA; --muted:#B3A591; --faint:#857867;
  --side:#0F0B08; --side-2:#211A14; --side-ink:#CDBFA9;
  --brass:#D1AC70; --brass-ink:#E0BE85; --brass-soft:#2E2416;
  --accent:#E6D3B3; --accent-ink:#1A140F;
  --pos:#62C08F; --pos-soft:#14301F; --neg:#F08C7C; --neg-soft:#3A1D18;
  --warn:#E5B653; --warn-soft:#33280F; --info:#86B3E0; --info-soft:#17283B; --idle:#A49C90; --idle-soft:#26201A;
  --shadow:0 1px 2px rgba(0,0,0,.35); color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.5 var(--f);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--brass-ink)}
.num{font-variant-numeric:tabular-nums}
.app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
.side{background:var(--side);color:var(--side-ink);padding:22px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:18px}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px}
.brand svg{flex:none}
.brand b{font:600 23px/1 var(--f-brand);color:#F3E6CF;letter-spacing:.3px}
.brand small{display:block;font-size:10.5px;letter-spacing:2.4px;color:var(--brass);margin-top:4px;text-transform:uppercase}
.nav{display:flex;flex-direction:column;gap:3px}
.nav button{all:unset;cursor:pointer;display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:9px;color:var(--side-ink);font-weight:500}
.nav button:hover{background:var(--side-2)}
.nav button[aria-current="page"]{background:var(--side-2);color:#FFF4E2;box-shadow:inset 3px 0 0 var(--brass)}
.nav svg{width:18px;height:18px;flex:none;opacity:.85}
.nav .badge{margin-left:auto;background:var(--brass);color:#1F1813;border-radius:99px;font-size:11px;font-weight:700;padding:1px 7px}
.side .me{margin-top:auto;font-size:12.5px;padding:0 8px;display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--side-2);padding-top:14px}
.side .me .role{color:var(--brass);font-size:11px;letter-spacing:1px;text-transform:uppercase}
.side .me button{all:unset;cursor:pointer;border:1px solid var(--side-2);border-radius:8px;padding:6px 10px;text-align:center}
main{padding:28px 30px 60px;min-width:0}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:20px}
h1{font:600 30px/1.1 var(--f-brand);margin:0;letter-spacing:.2px}
.head p{margin:4px 0 0;color:var(--muted)}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line-2);background:var(--surface);border-radius:9px;padding:8px 14px;cursor:pointer;font-weight:500;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--brass)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.gold{background:var(--brass);color:#1F1813;border-color:var(--brass)}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:8px}
.btn.ghost{background:transparent}
.btn.danger{color:var(--neg)}
.btn:disabled{opacity:.55;cursor:default}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.card-h{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.card-h h2{margin:0;font-size:15px;font-weight:600}
.card-b{padding:16px 18px}
.grid{display:grid;gap:16px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:18px}
.kpi{padding:16px 18px}
.kpi .l{font-size:12.5px;color:var(--muted);font-weight:500}
.kpi .v{font-size:26px;font-weight:700;margin-top:4px;letter-spacing:-.3px}
.kpi .s{font-size:12.5px;color:var(--muted);margin-top:2px}
.lock{display:inline-flex;align-items:center;gap:4px;font-size:11px;color:var(--brass-ink);background:var(--brass-soft);border-radius:99px;padding:1px 8px;margin-left:6px;font-weight:600}
.two{display:grid;grid-template-columns:1.4fr 1fr;gap:16px}
.ctl{border:1px solid var(--line-2);background:var(--surface);border-radius:9px;padding:8px 11px;min-width:0}
.ctl:focus,.btn:focus-visible{outline:2px solid var(--brass);outline-offset:1px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.bar .ctl{flex:1 1 150px}
.bar .q{flex:2 1 240px}
.tabs{display:inline-flex;background:var(--sunk);border-radius:10px;padding:3px;gap:2px}
.tabs button{all:unset;cursor:pointer;padding:6px 14px;border-radius:8px;font-weight:500;color:var(--muted);font-size:13.5px}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.pill{display:inline-flex;align-items:center;border-radius:99px;padding:2px 9px;font-size:12px;font-weight:600;white-space:nowrap}
.st-new{background:var(--idle-soft);color:var(--idle)}
.st-fix{background:var(--warn-soft);color:var(--warn)}
.st-ready{background:var(--pos-soft);color:var(--pos)}
.st-hold{background:var(--info-soft);color:var(--info)}
.st-sold{background:var(--brass-soft);color:var(--brass-ink)}
.wgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px}
.w{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;cursor:pointer;display:flex;flex-direction:column;box-shadow:var(--shadow);transition:transform .12s,border-color .12s}
.w:hover{transform:translateY(-2px);border-color:var(--brass)}
.w .ph{aspect-ratio:1;background:var(--sunk);position:relative;overflow:hidden}
.w .ph img{width:100%;height:100%;object-fit:cover;display:block}
.w .ph .pill{position:absolute;left:8px;top:8px;box-shadow:0 1px 3px rgba(0,0,0,.15)}
.w .ph .cnt{position:absolute;right:8px;bottom:8px;background:rgba(20,15,10,.65);color:#fff;font-size:11px;border-radius:99px;padding:1px 8px}
.w .bd{padding:10px 12px 12px;display:flex;flex-direction:column;gap:2px}
.w .code{font-size:11.5px;color:var(--faint);font-weight:600;letter-spacing:.4px}
.w .nm{font-weight:600;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.w .pr{font-weight:700;margin-top:4px}
.w .meta{font-size:12px;color:var(--muted);display:flex;justify-content:space-between;gap:6px}
.old{color:var(--neg);font-weight:600}
.noph{display:flex;align-items:center;justify-content:center;height:100%;color:var(--faint);flex-direction:column;gap:4px;font-size:12px}
.board{display:grid;grid-template-columns:repeat(5,minmax(200px,1fr));gap:12px;overflow-x:auto;padding-bottom:6px}
.col{background:var(--sunk);border-radius:var(--r);padding:10px;display:flex;flex-direction:column;gap:8px;min-height:120px}
.col h3{margin:0 2px 2px;font-size:13px;display:flex;justify-content:space-between;color:var(--muted)}
.mini{display:flex;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px;cursor:pointer;align-items:center}
.mini:hover{border-color:var(--brass)}
.mini img,.mini .noimg{width:48px;height:48px;border-radius:8px;object-fit:cover;flex:none;background:var(--line)}
.mini .t{font-size:13px;font-weight:600;line-height:1.3}
.mini .s{font-size:12px;color:var(--muted)}
table{width:100%;border-collapse:collapse}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);text-align:left;font-weight:600;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--sunk);white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--sunk)}
.r{text-align:right}
.tw{overflow-x:auto}
.thumb{width:42px;height:42px;border-radius:8px;object-fit:cover;background:var(--sunk);display:block}
.sub{color:var(--muted);font-size:12.5px}
.empty{padding:40px 20px;text-align:center;color:var(--muted)}
.list{display:flex;flex-direction:column;gap:8px}
.hbar{display:grid;grid-template-columns:110px 1fr 90px;gap:10px;align-items:center;font-size:13px}
.hbar .tr{background:var(--sunk);border-radius:6px;height:12px;overflow:hidden}
.hbar .fl{height:100%;background:var(--brass);border-radius:6px}
/* modal */
.ov{position:fixed;inset:0;background:rgba(20,14,9,.55);display:flex;align-items:flex-start;justify-content:center;padding:4vh 16px;z-index:40;overflow-y:auto}
.md{background:var(--surface);border-radius:16px;width:min(980px,100%);box-shadow:0 20px 60px rgba(0,0,0,.3);position:relative}
.md.sm{width:min(560px,100%)}
.md-h{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line);gap:10px}
.md-h h2{margin:0;font:600 22px/1.2 var(--f-brand)}
.md-b{padding:18px 20px}
.md-f{display:flex;justify-content:flex-end;gap:8px;padding:14px 20px;border-top:1px solid var(--line);flex-wrap:wrap}
.x{all:unset;cursor:pointer;font-size:22px;line-height:1;padding:4px 8px;border-radius:8px;color:var(--muted)}
.x:hover{background:var(--sunk)}
.det{display:grid;grid-template-columns:1.05fr 1fr;gap:22px}
.gal .main{aspect-ratio:1;background:var(--sunk);border-radius:12px;overflow:hidden;display:flex;align-items:center;justify-content:center}
.gal .main img{width:100%;height:100%;object-fit:contain;background:#0E0A07}
.gal .ths{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.gal .th{position:relative;width:68px;height:68px;border-radius:9px;overflow:hidden;border:2px solid transparent;cursor:pointer;background:var(--sunk)}
.gal .th.on{border-color:var(--brass)}
.gal .th img{width:100%;height:100%;object-fit:cover;display:block}
.gal .th .cov{position:absolute;left:3px;bottom:3px;background:var(--brass);color:#1F1813;font-size:9.5px;font-weight:700;border-radius:4px;padding:0 4px}
.gal .add{width:68px;height:68px;border-radius:9px;border:1.5px dashed var(--line-2);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--muted);font-size:12px;text-align:center;line-height:1.2}
.gal .tools{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.kv{display:grid;grid-template-columns:130px 1fr;gap:6px 12px;font-size:13.5px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-weight:500}
.box{border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px}
.box.own{border-color:var(--brass);background:var(--brass-soft)}
.box h3{margin:0;font-size:13px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);display:flex;justify-content:space-between;align-items:center}
.big{font-size:28px;font-weight:700;letter-spacing:-.4px}
.rep{display:flex;justify-content:space-between;gap:8px;font-size:13px;border-bottom:1px dashed var(--line-2);padding:4px 0}
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px}
.form label{display:flex;flex-direction:column;gap:5px;font-size:12.5px;font-weight:600;color:var(--muted)}
.form .full{grid-column:1/-1}
.form .ctl{font-weight:400;color:var(--ink);width:100%}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-2);border-radius:99px;padding:5px 11px;font-size:13px;cursor:pointer;font-weight:500;color:var(--ink);background:var(--surface)}
.chip input{accent-color:var(--brass)}
.sec{grid-column:1/-1;margin:6px 0 -2px;font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--brass-ink);font-weight:700;display:flex;align-items:center;gap:8px}
.sec::after{content:"";flex:1;height:1px;background:var(--line)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--accent);color:var(--accent-ink);padding:10px 18px;border-radius:10px;z-index:60;box-shadow:0 8px 24px rgba(0,0,0,.25);font-weight:500;max-width:calc(100vw - 32px)}
.toast.err{background:var(--neg);color:#fff}
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:var(--side)}
.login .card{width:min(400px,100%);padding:30px}
.login h1{font-size:34px;text-align:center}
.login p{text-align:center;color:var(--muted);margin:6px 0 20px}
.login form{display:flex;flex-direction:column;gap:10px}
.banner{background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:10px 14px;margin-bottom:16px;font-size:13.5px}
.chart svg{display:block;width:100%;height:auto}
.legend{display:flex;gap:14px;font-size:12.5px;color:var(--muted);margin-bottom:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.order{display:flex;gap:12px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.order.wait{border-color:var(--info)}
.prog{font-size:13px;color:var(--muted);margin-top:8px}
.mb-nav{display:none}
@media (max-width:900px){
  .two,.det{grid-template-columns:1fr}
}
@media (max-width:820px){
  .app{grid-template-columns:1fr}
  .side{position:sticky;top:0;height:auto;flex-direction:row;align-items:center;padding:10px 14px;z-index:20}
  .side .nav,.side .me{display:none}
  .side .mtop{margin-left:auto;display:flex;gap:6px}
  main{padding:18px 16px 96px}
  .mb-nav{display:flex;position:fixed;bottom:0;left:0;right:0;background:var(--side);z-index:30;justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
  .mb-nav button{all:unset;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;color:var(--side-ink);padding:4px 6px;border-radius:8px;position:relative}
  .mb-nav button[aria-current="page"]{color:var(--brass)}
  .mb-nav svg{width:21px;height:21px}
  .mb-nav .badge{position:absolute;top:0;right:2px;background:var(--brass);color:#1F1813;border-radius:99px;font-size:10px;font-weight:700;padding:0 5px}
  .wgrid{grid-template-columns:repeat(2,1fr);gap:10px}
  .form{grid-template-columns:1fr}
  .ov{padding:0}
  .md{border-radius:0;min-height:100vh}
  .kv{grid-template-columns:110px 1fr}
  h1{font-size:26px}
  .hbar{grid-template-columns:90px 1fr 70px}
}
@media (min-width:821px){.side .mtop{display:none}}
</style>
</head>
<body>
<div id="root"></div>
<script src="../config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.min.js"></script>
<script>
"use strict";
const CFG=window.TT_CONFIG||{};
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num=v=>{const n=Number(String(v??"").replace(/[^\d-]/g,""));return isFinite(n)?n:0};
const fmt=n=>Math.round(Number(n)||0).toLocaleString("vi-VN");
const fmtM=n=>{n=Number(n)||0;const a=Math.abs(n);return a>=1e9?(n/1e9).toLocaleString("vi-VN",{maximumFractionDigits:2})+" tỷ":a>=1e6?(n/1e6).toLocaleString("vi-VN",{maximumFractionDigits:1})+" tr":a>=1e3?Math.round(n/1e3)+"k":String(Math.round(n))};
const pad=n=>String(n).padStart(2,"0");
const isoOf=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const todayISO=()=>isoOf(new Date());
const dmy=s=>s?s.slice(0,10).split("-").reverse().join("/"):"";
const daysSince=s=>s?Math.max(0,Math.floor((new Date(todayISO())-new Date(s.slice(0,10)))/864e5)):0;
const addMonths=(iso,m)=>{const d=new Date(iso);d.setMonth(d.getMonth()+m);return isoOf(d)};
const monthOf=s=>(s||"").slice(0,7);
const mLabel=m=>{const [y,mm]=m.split("-");return `T${Number(mm)}/${y.slice(2)}`};

const STATUSES=["Mới nhập","Đang sửa / lau dầu","Sẵn sàng bán","Đang giữ (đơn web)","Khách đã cọc","Đã bán"];
const ST_CLS={"Mới nhập":"st-new","Đang sửa / lau dầu":"st-fix","Sẵn sàng bán":"st-ready","Đang giữ (đơn web)":"st-hold","Khách đã cọc":"st-hold","Đã bán":"st-sold"};
const CHANNELS=["TikTok","Facebook","Instagram","Website","Khách quen / giới thiệu","Tại shop","Khác"];
const PAYS=["Chuyển khoản","Tiền mặt","Thẻ","COD (ship thu hộ)"];
const ACCS=["Hộp","Sổ / giấy tờ","Thẻ bảo hành","Dây zin","Khoá zin","Mắt dây dư"];
const MOVES=["Automatic","Quartz","Lên cót tay","Solar","Kinetic","Spring Drive"];
const CONDS=["Như mới","Rất đẹp (95%+)","Đẹp (90%)","Có trầy xước nhẹ","Cũ, cần sửa"];
const REPAIRS=["Lau dầu","Thay kính","Thay dây","Đánh bóng vỏ","Thay pin","Thay ron / chống nước","Thay núm / chốt","Khác"];
const EXP_CATS=["Quảng cáo TikTok / FB / IG","Ship / vận chuyển","Phí sàn / phí thanh toán","Hộp, bao bì, quà tặng","Phụ tùng / dụng cụ chung","Mặt bằng / điện nước","Khác"];
const BRANDS=["Seiko","Grand Seiko","Citizen","Orient","Casio","Omega","Longines","Tissot","Rolex","Tudor","Rado","Hamilton","Bulova","Cartier","Tag Heuer","Oris","Zenith","Jaeger-LeCoultre","Patek Philippe","Audemars Piguet","Credor","King Seiko","Lord Marvel"];

// ---------- ảnh ----------
async function compress(file,max,q){
  const bmp=await (window.createImageBitmap?createImageBitmap(file).catch(()=>null):null)||await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=()=>rej(new Error("Không đọc được ảnh "+file.name));i.src=URL.createObjectURL(file)});
  const w=bmp.width,h=bmp.height,k=Math.min(1,max/Math.max(w,h));const c=document.createElement("canvas");c.width=Math.round(w*k);c.height=Math.round(h*k);
  c.getContext("2d").drawImage(bmp,0,0,c.width,c.height);return await new Promise(r=>c.toBlob(r,"image/jpeg",q));
}
async function uploadPhoto(id,file){
  const base=`${id}/${Date.now()}-${Math.random().toString(36).slice(2,7)}`;
  const [big,small]=await Promise.all([compress(file,1600,.84),compress(file,480,.8)]);
  const a=await sb.storage.from("photos").upload(base+".jpg",big,{contentType:"image/jpeg"});if(a.error)throw a.error;
  const b=await sb.storage.from("photos").upload(base+"_t.jpg",small,{contentType:"image/jpeg"});if(b.error)throw b.error;
  return {p:base+".jpg",t:base+"_t.jpg"};
}
function nextIds(n){let m=0;S.watches.forEach(w=>{const k=parseInt(String(w.id).replace(/\D/g,""),10);if(k>m)m=k});return Array.from({length:n},(_,i)=>"TT"+String(m+1+i).padStart(3,"0"))}

async function load(){
  const [w,c,e,o]=await Promise.all([
    sb.from("watches").select("*").order("created_at",{ascending:false}),
    S.owner?sb.from("watch_costs").select("*"):Promise.resolve({data:[]}),
    S.owner?sb.from("tt_expenses").select("*").order("date",{ascending:false}):Promise.resolve({data:[]}),
    sb.from("tt_orders").select("*").order("created_at",{ascending:false}).limit(300)]);
  if(w.error){if(/relation|does not exist|schema cache/i.test(w.error.message)){S.needSetup=true;S.watches=[]}else throw w.error}else S.needSetup=false;
  S.watches=(w.data||[]).map(x=>({...x,photos:Array.isArray(x.photos)?x.photos:[],accessories:Array.isArray(x.accessories)?x.accessories:[]}));
  S.costs=new Map((c.data||[]).map(r=>[r.watch_id,{...r,repairs:Array.isArray(r.repairs)?r.repairs:[]}]));
  S.exps=e.data||[];S.orders=o.error?[]:(o.data||[]);
}

async function saveWatch(f){
  const fd=new FormData(f), id=f.dataset.id;const btn=$('button[form="wf"]');btn.disabled=true;
  const row={brand:fd.get("brand").trim(),model:fd.get("model").trim(),ref:fd.get("ref").trim(),year:fd.get("year").trim(),movement:fd.get("movement"),size:fd.get("size").trim(),material:fd.get("material").trim(),condition:fd.get("condition"),accessories:fd.getAll("acc"),list_price:num(fd.get("list_price")),in_date:fd.get("in_date")||null,note:fd.get("note").trim(),shop_desc:fd.get("shop_desc").trim(),show_on_shop:fd.get("show_on_shop")==="1",updated_at:new Date().toISOString()};
  try{
    let wid=id;
    if(id){const r=await sb.from("watches").update(row).eq("id",id);if(r.error)throw r.error}
    else{wid=nextIds(1)[0];const files=[...(f.files?.files||[])];const photos=[];const pr=$("#wfProg");
      for(let i=0;i<files.length;i++){pr.textContent=`Đang tải ảnh ${i+1}/${files.length}…`;photos.push(await uploadPhoto(wid,files[i]))}
      const r=await sb.from("watches").insert({...row,id:wid,status:fd.get("status")||"Mới nhập",photos,created_by:S.email});if(r.error)throw r.error}
    if(S.owner){const bp=num(fd.get("buy_price")),bf=fd.get("buy_from").trim();const old=S.costs.get(wid);if(bp||bf||old){const r=await sb.from("watch_costs").upsert({watch_id:wid,buy_price:bp,buy_from:bf,repairs:old?.repairs||[],updated_at:new Date().toISOString()});if(r.error)throw r.error}}
    toast(id?"Đã lưu":"Đã thêm "+wid);closeModal();await load();render();openWatch(wid);
  }catch(e){fail(e);btn.disabled=false}
}

// ---------- Báo cáo ----------
function vRep(){
  const sold=S.watches.filter(w=>stOf(w)==="Đã bán"&&inPeriod(w.sold_date,S.period));
  const rev=sold.reduce((a,w)=>a+(Number(w.sale_price)||0),0),cogs=sold.reduce((a,w)=>a+costOf(w),0),exp=S.exps.filter(e=>inPeriod(e.date,S.period)).reduce((a,e)=>a+(Number(e.amount)||0),0);
  const days=sold.filter(w=>w.in_date&&w.sold_date).map(w=>Math.max(0,(new Date(w.sold_date)-new Date(w.in_date))/864e5));const avgD=days.length?Math.round(days.reduce((a,b)=>a+b,0)/days.length):0;
  const months=[];const d=new Date(todayISO());d.setDate(1);for(let i=5;i>=0;i--){const x=new Date(d);x.setMonth(d.getMonth()-i);months.push(monthOf(isoOf(x)))}
  const mdata=months.map(m=>{const s=S.watches.filter(w=>stOf(w)==="Đã bán"&&monthOf(w.sold_date)===m);const r=s.reduce((a,w)=>a+(Number(w.sale_price)||0),0);const p=s.reduce((a,w)=>a+profitOf(w),0)-S.exps.filter(e=>monthOf(e.date)===m).reduce((a,e)=>a+(Number(e.amount)||0),0);return {m,r,p,n:s.length}});
  const grp=key=>{const g={};sold.forEach(w=>{const k=key(w)||"(chưa rõ)";const o=g[k]=g[k]||{n:0,r:0,p:0};o.n++;o.r+=Number(w.sale_price)||0;o.p+=profitOf(w)});return Object.entries(g).sort((a,b)=>b[1].p-a[1].p)};
  const tbl=(title,rows)=>`<div class="card tw"><div class="card-h"><h2>${title}</h2></div><table><thead><tr><th></th><th class="r">Chiếc</th><th class="r">Doanh thu</th><th class="r">Lãi</th><th class="r">Lãi / chiếc</th></tr></thead><tbody>${rows.map(([k,o])=>`<tr><td>${esc(k)}</td><td class="r num">${o.n}</td><td class="r num">${fmtM(o.r)}</td><td class="r num" style="color:${o.p<0?"var(--neg)":"var(--pos)"}">${fmtM(o.p)}</td><td class="r num">${fmtM(o.p/o.n)}</td></tr>`).join("")||`<tr><td colspan="5" class="empty">Chưa có dữ liệu.</td></tr>`}</tbody></table></div>`;
  const net=rev-cogs-exp;
  return `<div class="head"><div><h1>Báo cáo lãi</h1><p>Lãi = giá bán − (giá nhập + chi phí sửa) − chi phí shop</p></div>
   <div class="btns"><select class="ctl" id="period">${Object.entries(PERIODS).map(([k,l])=>`<option value="${k}"${S.period===k?" selected":""}>${l}</option>`).join("")}</select><button class="btn" type="button" data-act="csv">Xuất Excel (CSV)</button></div></div>
  <div class="kpis">
   <div class="card kpi"><div class="l">Doanh thu</div><div class="v num">${fmtM(rev)}</div><div class="s">${sold.length} chiếc đã bán</div></div>
   <div class="card kpi"><div class="l">Giá vốn hàng đã bán</div><div class="v num">${fmtM(cogs)}</div><div class="s">Giá nhập + chi phí sửa</div></div>
   <div class="card kpi"><div class="l">Chi phí shop</div><div class="v num">${fmtM(exp)}</div><div class="s">Quảng cáo, ship, hộp quà…</div></div>
   <div class="card kpi"><div class="l">Lãi ròng</div><div class="v num" style="color:${net<0?"var(--neg)":"var(--pos)"}">${fmtM(net)}</div><div class="s">${rev?Math.round(net/rev*100)+"% doanh thu":""}${avgD?` · bán trung bình sau ${avgD} ngày`:""}</div></div>
  </div>
  <div class="card" style="margin-bottom:16px"><div class="card-h"><h2>6 tháng gần nhất</h2></div><div class="card-b chart"><div class="legend"><span><i style="background:var(--brass)"></i>Doanh thu</span><span><i style="background:var(--pos)"></i>Lãi ròng</span></div>${chart(mdata)}</div></div>
  <div class="two">${tbl("Theo kênh bán",grp(w=>w.channel))}${tbl("Theo hãng",grp(w=>w.brand))}</div>`;
}
function chart(d){
  const W=720,H=240,P={l:52,r:10,t:10,b:30};const mx=Math.max(1,...d.map(x=>Math.max(x.r,x.p))),mn=Math.min(0,...d.map(x=>x.p));const y=v=>P.t+(mx-v)/(mx-mn)*(H-P.t-P.b);const bw=(W-P.l-P.r)/d.length;
  const ticks=[0,.5,1].map(k=>mn+(mx-mn)*k);
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Doanh thu và lãi 6 tháng">${ticks.map(t=>`<line x1="${P.l}" x2="${W-P.r}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)"/><text x="${P.l-8}" y="${y(t)+4}" text-anchor="end" font-size="11" fill="var(--muted)">${fmtM(t)}</text>`).join("")}
  ${d.map((x,i)=>{const cx=P.l+bw*i+bw/2,b=Math.min(28,bw/3);return `<rect x="${cx-b-2}" y="${y(Math.max(0,x.r))}" width="${b}" height="${Math.abs(y(0)-y(x.r))}" rx="3" fill="var(--brass)"><title>${mLabel(x.m)}: doanh thu ${fmt(x.r)} ₫ (${x.n} chiếc)</title></rect><rect x="${cx+2}" y="${y(Math.max(0,x.p))}" width="${b}" height="${Math.abs(y(0)-y(x.p))}" rx="3" fill="${x.p<0?"var(--neg)":"var(--pos)"}"><title>${mLabel(x.m)}: lãi ${fmt(x.p)} ₫</title></rect><text x="${cx}" y="${H-10}" text-anchor="middle" font-size="12" fill="var(--muted)">${mLabel(x.m)}</text>`}).join("")}</svg>`;
}

  if(e.target.matches("[data-money]")){const v=num(e.target.value);e.target.value=v?fmt(v):""}});
document.addEventListener("submit",async e=>{e.preventDefault();const f=e.target;
  if(f.id==="wf")saveWatch(f);else if(f.id==="qf")quickSave(f);else if(f.id==="sf")saveSell(f);
  else if(f.id==="ef"){const fd=new FormData(f);const r=await sb.from("tt_expenses").insert({date:fd.get("date"),category:fd.get("category"),amount:num(fd.get("amount")),note:fd.get("note").trim()});if(r.error)return fail(r.error);toast("Đã thêm khoản chi");await load();render()}
  else if(f.id==="login"){const b=f.querySelector("button");b.disabled=true;const {error}=await sb.auth.signInWithPassword({email:f.email.value.trim(),password:f.pw.value});if(error){$("#lerr").textContent="Sai email hoặc mật khẩu.";b.disabled=false}else boot()}
});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeModal()});
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&S.email&&!$(".ov"))reload()});

// ---------- khởi động ----------
function loginView(msg){
  $("#root").innerHTML=`<div class="login"><div class="card"><div style="display:flex;justify-content:center;margin-bottom:8px">${LOGO.replace('width="34" height="34"','width="54" height="54"')}</div><h1>TimelessTouch</h1><p>Quản lý kho đồng hồ</p>
  ${msg?`<div class="banner">${msg}</div>`:`<form id="login"><input class="ctl" name="email" type="email" placeholder="Email" autocomplete="username" required><input class="ctl" name="pw" type="password" placeholder="Mật khẩu" autocomplete="current-password" required><button class="btn pri" type="submit" style="justify-content:center">Đăng nhập</button><div id="lerr" class="sub" style="color:var(--neg);text-align:center"></div></form>`}</div></div>`;
}
async function boot(){
  if(!CFG.SUPABASE_URL||!CFG.SUPABASE_ANON_KEY){loginView("Chưa kết nối cơ sở dữ liệu. Điền <b>SUPABASE_URL</b> và <b>SUPABASE_ANON_KEY</b> trong file <code>timeless/config.js</code>.");return}
  sb=sb||window.supabase.createClient(CFG.SUPABASE_URL,CFG.SUPABASE_ANON_KEY);
  const {data}=await sb.auth.getSession();if(!data.session){loginView();return}
  S.email=data.session.user.email;
  const ow=await sb.from("owners").select("email");S.owner=!ow.error&&(ow.data||[]).length>0;
  try{await load()}catch(e){fail(e)}render();
}
boot();
</script>
</body>
