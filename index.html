<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>TimelessTouch · Đồng hồ vintage Nhật</title>
<meta name="description" content="TimelessTouch — đồng hồ vintage Nhật & Thụy Sĩ tuyển chọn, mỗi mẫu một chiếc. Xem ảnh thật, đặt mua và chuyển khoản ngay.">
<meta name="theme-color" content="#1F1813">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231F1813'/%3E%3Ccircle cx='32' cy='32' r='19' fill='none' stroke='%23C9A46A' stroke-width='4'/%3E%3Cpath d='M32 20v13l8 5' stroke='%23C9A46A' stroke-width='4' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&display=swap">
<style>
:root{
  --bg:#F6F1E8; --surface:#FFFDF9; --sunk:#EDE6DA; --line:#E2D8C7; --line-2:#CFC2AC;
  --ink:#211A13; --muted:#6D6152; --faint:#9B8F7F;
  --dark:#1F1813; --dark-ink:#EADCC5; --brass:#B08A4F; --brass-ink:#7A5A26; --brass-soft:#F2E8D6;
  --pos:#2E7350; --neg:#B23A2C; --info:#2F5E8A;
  --f:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; --f-b:"Cormorant Garamond",Georgia,serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#14100C; --surface:#1D1712; --sunk:#191410; --line:#33291F; --line-2:#46392B;
  --ink:#F1E8DA; --muted:#B3A591; --faint:#857867; --dark:#0E0A07; --dark-ink:#E6D7BE;
  --brass:#D1AC70; --brass-ink:#E0BE85; --brass-soft:#2D2416; --pos:#62C08F; --neg:#F08C7C; --info:#86B3E0; color-scheme:dark}}
:root[data-theme="dark"]{--bg:#14100C; --surface:#1D1712; --sunk:#191410; --line:#33291F; --line-2:#46392B;
  --ink:#F1E8DA; --muted:#B3A591; --faint:#857867; --dark:#0E0A07; --dark-ink:#E6D7BE;
  --brass:#D1AC70; --brass-ink:#E0BE85; --brass-soft:#2D2416; --pos:#62C08F; --neg:#F08C7C; --info:#86B3E0; color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.55 var(--f);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
.num{font-variant-numeric:tabular-nums}
header{background:var(--dark);color:var(--dark-ink);position:sticky;top:0;z-index:20}
.hd{max-width:1180px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:12px}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none}
.logo b{font:600 25px/1 var(--f-b);color:#F5E7CE;letter-spacing:.3px}
.hd nav{margin-left:auto;display:flex;gap:6px}
.ic{display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:99px;border:1px solid rgba(234,220,197,.25);color:var(--dark-ink);text-decoration:none;font-size:12px;font-weight:600}
.ic:hover{border-color:var(--brass);color:var(--brass)}
.hero{background:var(--dark);color:var(--dark-ink);padding:34px 20px 46px;text-align:center;border-top:1px solid rgba(234,220,197,.08)}
.hero h1{font:500 italic clamp(30px,5vw,48px)/1.1 var(--f-b);margin:0;color:#F5E7CE}
.hero p{max-width:560px;margin:12px auto 0;color:#BFAF97}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin:-22px 0 22px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px;box-shadow:0 6px 20px rgba(30,20,10,.08)}
.ctl{border:1px solid var(--line-2);background:var(--surface);border-radius:10px;padding:9px 12px;min-width:0}
.ctl:focus,.btn:focus-visible{outline:2px solid var(--brass);outline-offset:1px}
.tools .q{flex:2 1 220px}.tools select{flex:1 1 140px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:18px;padding-bottom:50px}
.it{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;cursor:pointer;text-decoration:none;display:flex;flex-direction:column;transition:transform .15s,box-shadow .15s}
.it:hover{transform:translateY(-3px);box-shadow:0 10px 26px rgba(30,20,10,.12)}
.it .ph{aspect-ratio:1;background:var(--sunk);position:relative}
.it .ph img{width:100%;height:100%;object-fit:cover;display:block}
.it .tag{position:absolute;left:10px;top:10px;background:rgba(20,15,10,.75);color:#F5E7CE;font-size:11.5px;border-radius:99px;padding:3px 10px;font-weight:600}
.it .bd{padding:12px 14px 14px;display:flex;flex-direction:column;gap:3px}
.it .br{font-size:11.5px;letter-spacing:1.6px;text-transform:uppercase;color:var(--brass-ink);font-weight:700}
.it .nm{font:600 20px/1.2 var(--f-b)}
.it .mt{font-size:12.5px;color:var(--muted)}
.it .pr{font-weight:700;font-size:17px;margin-top:6px}
.btn{border:1px solid var(--line-2);background:var(--surface);border-radius:11px;padding:11px 18px;cursor:pointer;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.btn.pri{background:var(--dark);color:#F5E7CE;border-color:var(--dark)}
.btn.gold{background:var(--brass);border-color:var(--brass);color:#1F1813}
.btn:disabled{opacity:.6;cursor:default}
.empty{text-align:center;color:var(--muted);padding:60px 20px}
.ov{position:fixed;inset:0;background:rgba(15,10,6,.6);z-index:40;display:flex;align-items:flex-start;justify-content:center;padding:4vh 16px;overflow-y:auto}
.md{background:var(--surface);border-radius:18px;width:min(1000px,100%);position:relative;box-shadow:0 30px 80px rgba(0,0,0,.35)}
.md.sm{width:min(520px,100%)}
.x{all:unset;right:10px;top:10px;cursor:pointer;width:38px;height:38px;border-radius:99px;display:flex;align-items:center;justify-content:center;font-size:24px;background:var(--surface);color:var(--muted);z-index:2;position:absolute}
.det{display:grid;grid-template-columns:1.1fr 1fr}
.gal{background:#0F0B08;border-radius:18px 0 0 18px;overflow:hidden;display:flex;flex-direction:column}
.gal .main{aspect-ratio:1;display:flex;align-items:center;justify-content:center;position:relative;touch-action:pan-y}
.gal .main img{width:100%;height:100%;object-fit:contain}
.gal .nav{all:unset;cursor:pointer;width:40px;height:40px;border-radius:99px;background:rgba(255,255,255,.85);color:#211A13;display:flex;align-items:center;justify-content:center;font-size:22px;position:absolute;top:calc(50% - 20px)}
.gal .prev{left:10px}.gal .next{right:10px}
.gal .ths{display:flex;gap:6px;padding:10px;overflow-x:auto}
.gal .ths img{width:58px;height:58px;object-fit:cover;border-radius:8px;cursor:pointer;opacity:.6;border:2px solid transparent;flex:none}
.gal .ths img.on{opacity:1;border-color:var(--brass)}
.info{padding:30px 28px;display:flex;flex-direction:column;gap:14px}
.info .br{font-size:12px;letter-spacing:2px;text-transform:uppercase;color:var(--brass-ink);font-weight:700}
.info h2{font:600 34px/1.1 var(--f-b);margin:0}
.info .pr{font-size:28px;font-weight:700;letter-spacing:-.4px}
.spec{display:grid;grid-template-columns:120px 1fr;gap:7px 12px;font-size:14px;margin:0}
.spec dt{color:var(--muted)}.spec dd{margin:0;font-weight:500}
.desc{background:var(--brass-soft);border-radius:12px;padding:12px 14px;font-size:14px;white-space:pre-line}
.trust{display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:13px;color:var(--muted)}
.trust span::before{content:"✓ ";color:var(--pos);font-weight:700}
.held{background:var(--sunk);border-radius:12px;padding:12px;color:var(--muted);font-size:14px;text-align:center}
.form{display:flex;flex-direction:column;gap:12px;padding:26px 24px}
.form h2{font:600 28px/1.1 var(--f-b);margin:0 40px 0 0}
.form label{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:600;color:var(--muted)}
.form .ctl{font-weight:400;color:var(--ink)}
.sumy{display:flex;gap:12px;align-items:center;background:var(--sunk);border-radius:12px;padding:10px}
.sumy img{width:56px;height:56px;border-radius:9px;object-fit:cover}
.err{color:var(--neg);font-size:13.5px}
.pay{text-align:center;display:flex;flex-direction:column;gap:12px;padding:26px 24px}
.pay h2{font:600 28px/1.1 var(--f-b);margin:0}
.qr{background:#fff;border-radius:14px;padding:10px;width:min(300px,100%);margin:0 auto;border:1px solid var(--line)}
.qr img{width:100%;display:block}
.bank{display:grid;grid-template-columns:auto 1fr auto;gap:8px 10px;text-align:left;background:var(--sunk);border-radius:12px;padding:12px 14px;font-size:14px;align-items:center}
.bank dt{color:var(--muted)}.bank dd{margin:0;font-weight:600;word-break:break-all}
.copy{all:unset;cursor:pointer;font-size:12px;color:var(--brass-ink);font-weight:600;border:1px solid var(--line-2);border-radius:8px;padding:3px 8px}
.code{font-size:22px;letter-spacing:2px}
.note{font-size:13px;color:var(--muted)}
.okbox{background:#E2F0E7;color:#1F5A3B;border-radius:12px;padding:14px;font-weight:500}
footer{background:var(--dark);color:#BFAF97;padding:30px 20px;text-align:center;font-size:13.5px}
footer b{font:600 22px var(--f-b);color:#F5E7CE;display:block;margin-bottom:6px}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--dark);color:#F5E7CE;padding:10px 18px;border-radius:10px;z-index:60}
@media (max-width:780px){
  .det{grid-template-columns:1fr}.gal{border-radius:0}
  .ov{padding:0}.md{border-radius:0;min-height:100vh}
  .grid{grid-template-columns:repeat(2,1fr);gap:10px}
  .it .nm{font-size:17px}.it .bd{padding:10px}
  .info{padding:22px 18px 30px}.info h2{font-size:28px}
  .hd nav .ic:nth-child(n+4){display:none}
}
</style>
</head>
<body>
<header><div class="hd"><a class="logo" href="#"><svg width="32" height="32" viewBox="0 0 64 64"><circle cx="32" cy="32" r="22" fill="none" stroke="#C9A46A" stroke-width="3.5"/><path d="M32 18v14l9 6" stroke="#C9A46A" stroke-width="3.5" fill="none" stroke-linecap="round"/></svg><b>TimelessTouch</b></a><nav id="soc"></nav></div></header>
<section class="hero"><h1>Đồng hồ vintage tuyển chọn</h1><p>Mỗi mẫu chỉ một chiếc · ảnh chụp thật tại shop · đặt mua và chuyển khoản ngay trên web, shop giữ hàng cho bạn.</p></section>
<main class="wrap"><div class="tools"><input class="ctl q" id="q" type="search" placeholder="Tìm hãng, mẫu, ref…"><select class="ctl" id="fb"><option value="">Mọi hãng</option></select><select class="ctl" id="so"><option value="new">Mới về</option><option value="lo">Giá thấp → cao</option><option value="hi">Giá cao → thấp</option></select></div>
<div id="list" class="grid"><div class="empty">Đang tải…</div></div></main>
<footer><b>TimelessTouch</b><span id="addr"></span><div id="soc2" style="margin-top:10px;display:flex;gap:8px;justify-content:center"></div></footer>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.min.js"></script>
<script>
"use strict";
const C=window.TT_CONFIG||{};
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=n=>Math.round(Number(n)||0).toLocaleString("vi-VN");
const url=p=>p?`${C.SUPABASE_URL}/storage/v1/object/public/photos/${p.split("/").map(encodeURIComponent).join("/")}`:"";
const nm=w=>[w.model].filter(Boolean).join(" ")||w.brand||"Đồng hồ vintage";
let sb=null, ITEMS=[], gi=0, poll=null;
function toast(m){const t=document.createElement("div");t.className="toast";t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2200)}

function socials(){
  const z=(C.ZALO||"").replace(/\D/g,"");
  const L=[[z&&`https://zalo.me/${z}`,"Zalo"],[C.FACEBOOK,"FB"],[C.INSTAGRAM,"IG"],[C.TIKTOK,"TT"]].filter(x=>x[0]);
  const h=L.map(([u,l])=>`<a class="ic" href="${esc(u)}" target="_blank" rel="noopener" aria-label="${l}">${l}</a>`).join("");
  $("#soc").innerHTML=h;$("#soc2").innerHTML=h;$("#addr").textContent=C.ADDRESS||"";
}
function render(){
  const q=$("#q").value.trim().toLowerCase(),b=$("#fb").value,s=$("#so").value;
  const L=ITEMS.filter(w=>(!b||w.brand===b)&&(!q||[w.brand,w.model,w.ref,w.year,w.movement].join(" ").toLowerCase().includes(q)))
    .sort(s==="lo"?(a,c)=>a.list_price-c.list_price:s==="hi"?(a,c)=>c.list_price-a.list_price:(a,c)=>(a.avail===c.avail?0:a.avail==="available"?-1:1)||String(c.updated_at).localeCompare(String(a.updated_at)));
  $("#list").innerHTML=L.map(w=>{const p=(w.photos||[])[0];return `<a class="it" href="#${encodeURIComponent(w.id)}"><div class="ph">${p?`<img src="${esc(url(p.t||p.p))}" alt="${esc(w.brand+" "+nm(w))}" loading="lazy">`:""}${w.avail!=="available"?'<span class="tag">Đang có khách giữ</span>':""}</div>
    <div class="bd"><span class="br">${esc(w.brand)}</span><span class="nm">${esc(nm(w))}</span><span class="mt">${esc([w.ref,w.year,w.movement].filter(Boolean).join(" · "))}</span><span class="pr num">${fmt(w.list_price)} ₫</span></div></a>`}).join("")||`<div class="empty" style="grid-column:1/-1">${ITEMS.length?"Không có mẫu khớp tìm kiếm.":"Shop đang cập nhật hàng mới, bạn quay lại sau nhé."}</div>`;
}
function modal(h){closeM();const o=document.createElement("div");o.className="ov";o.innerHTML=h;o.addEventListener("mousedown",e=>{if(e.target===o)goHome()});document.body.appendChild(o);document.body.style.overflow="hidden"}
function closeM(){document.querySelectorAll(".ov").forEach(x=>x.remove());document.body.style.overflow="";if(poll){clearInterval(poll);poll=null}}
function goHome(){closeM();if(location.hash)history.pushState("",document.title,location.pathname+location.search)}
function detail(id,keep){
  const w=ITEMS.find(x=>x.id===id);if(!w){goHome();return}if(!keep)gi=0;const ph=w.photos||[];
  document.title=`${w.brand} ${nm(w)} · TimelessTouch`;
  const spec=[["Hãng",w.brand],["Mẫu",w.model],["Ref",w.ref],["Năm",w.year],["Bộ máy",w.movement],["Size",w.size],["Chất liệu",w.material],["Tình trạng",w.condition],["Kèm theo",(w.accessories||[]).join(", ")],["Mã sản phẩm",w.id]].filter(x=>x[1]);
  modal(`<div class="md"><button class="x" type="button" data-a="home" aria-label="Đóng">×</button><div class="det">
   <div class="gal"><div class="main" id="gm">${ph.length?`<img src="${esc(url(ph[gi].p))}" alt="">`:""}${ph.length>1?`<button class="nav prev" data-a="prev" aria-label="Ảnh trước">‹</button><button class="nav next" data-a="next" aria-label="Ảnh sau">›</button>`:""}</div>
    ${ph.length>1?`<div class="ths">${ph.map((p,i)=>`<img src="${esc(url(p.t||p.p))}" class="${i===gi?"on":""}" data-g="${i}" alt="">`).join("")}</div>`:""}</div>
   <div class="info"><span class="br">${esc(w.brand)}</span><h2>${esc(nm(w))}</h2><div class="pr num">${fmt(w.list_price)} ₫</div>
    ${w.shop_desc?`<div class="desc">${esc(w.shop_desc)}</div>`:""}
    <dl class="spec">${spec.map(([k,v])=>`<dt>${k}</dt><dd>${esc(v)}</dd>`).join("")}</dl>
    ${w.avail==="available"?`<button class="btn gold" type="button" data-a="buy" style="font-size:16px;padding:14px">Mua ngay · chuyển khoản</button>`:`<div class="held">Chiếc này đang có khách giữ. Nhắn shop để được báo nếu khách không lấy.</div>`}
    <div style="display:flex;gap:8px;flex-wrap:wrap">${(C.ZALO?`<a class="btn" style="flex:1" href="https://zalo.me/${esc(String(C.ZALO).replace(/\D/g,""))}" target="_blank" rel="noopener">Hỏi qua Zalo</a>`:"")+(C.FACEBOOK?`<a class="btn" style="flex:1" href="${esc(C.FACEBOOK)}" target="_blank" rel="noopener">Nhắn Facebook</a>`:"")}</div>
    <div class="trust"><span>Ảnh chụp thật</span><span>Kiểm tra máy trước khi giao</span><span>Bảo hành máy</span><span>Giữ hàng 2 tiếng khi đặt</span></div>
   </div></div></div>`);
  const m=$("#gm");let x0=null;m?.addEventListener("touchstart",e=>{x0=e.touches[0].clientX},{passive:true});m?.addEventListener("touchend",e=>{if(x0==null)return;const dx=e.changedTouches[0].clientX-x0;if(Math.abs(dx)>40){gi=(gi+(dx<0?1:-1)+ph.length)%ph.length;detail(id,true)}x0=null});
}
function buyForm(id){
  const w=ITEMS.find(x=>x.id===id);const p=(w.photos||[])[0];
  modal(`<div class="md sm"><button class="x" type="button" data-a="back" data-id="${esc(id)}" aria-label="Quay lại">×</button><form class="form" id="bf" data-id="${esc(id)}">
   <h2>Đặt mua</h2>
   <div class="sumy">${p?`<img src="${esc(url(p.t||p.p))}" alt="">`:""}<div><b>${esc(w.brand)} ${esc(nm(w))}</b><div class="num">${fmt(w.list_price)} ₫</div></div></div>
   <label>Họ tên<input class="ctl" name="name" autocomplete="name" required minlength="2"></label>
   <label>Số điện thoại<input class="ctl" name="phone" type="tel" inputmode="tel" autocomplete="tel" required pattern="[0-9 +.]{9,15}"></label>
   <label>Địa chỉ nhận hàng (bỏ trống nếu đến shop lấy)<textarea class="ctl" name="address" rows="2" autocomplete="street-address"></textarea></label>
   <label>Lời nhắn cho shop<input class="ctl" name="note"></label>
   <div class="err" id="berr"></div>
   <button class="btn gold" type="submit" style="padding:14px;font-size:16px">Đặt hàng & hiện mã chuyển khoản</button>
   <span class="note">Sau khi đặt, shop giữ chiếc đồng hồ này cho bạn trong 2 tiếng để chuyển khoản. Shop sẽ gọi xác nhận trước khi giao.</span>
  </form></div>`);
}
function payView(id,code,amount){
  const w=ITEMS.find(x=>x.id===id)||{};const hasBank=C.BANK_BIN&&C.ACCOUNT_NO;
  const qr=hasBank?`https://img.vietqr.io/image/${encodeURIComponent(C.BANK_BIN)}-${encodeURIComponent(C.ACCOUNT_NO)}-compact2.png?amount=${Math.round(amount)}&addInfo=${encodeURIComponent(code)}&accountName=${encodeURIComponent(C.ACCOUNT_NAME||"")}`:"";
  try{localStorage.setItem("tt_last_order",JSON.stringify({id,code,amount,t:Date.now()}))}catch(e){}
  modal(`<div class="md sm"><button class="x" type="button" data-a="home" aria-label="Đóng">×</button><div class="pay">
   <h2>Đặt hàng thành công</h2><div class="note">${esc(w.brand||"")} ${esc(w.model||"")} · giữ hàng cho bạn trong 2 tiếng</div>
   ${hasBank?`<div class="qr"><img src="${esc(qr)}" alt="Mã QR chuyển khoản ${fmt(amount)} đồng, nội dung ${esc(code)}"></div><div class="note">Mở app ngân hàng → quét mã QR. Số tiền và nội dung đã điền sẵn.</div>`:""}
   <dl class="bank">
    ${hasBank?`<dt>Ngân hàng</dt><dd>${esc(C.BANK_NAME||C.BANK_BIN)}</dd><span></span><dt>Số tài khoản</dt><dd class="num">${esc(C.ACCOUNT_NO)}</dd><button class="copy" type="button" data-copy="${esc(C.ACCOUNT_NO)}">Chép</button><dt>Chủ tài khoản</dt><dd>${esc(C.ACCOUNT_NAME)}</dd><span></span>`:""}
    <dt>Số tiền</dt><dd class="num">${fmt(amount)} ₫</dd><button class="copy" type="button" data-copy="${Math.round(amount)}">Chép</button>
    <dt>Nội dung CK</dt><dd class="code">${esc(code)}</dd><button class="copy" type="button" data-copy="${esc(code)}">Chép</button></dl>
   ${hasBank?"":`<div class="note">Shop sẽ gọi cho bạn để gửi thông tin chuyển khoản.</div>`}
   <div id="pst" class="note">Sau khi chuyển khoản, shop kiểm tra và xác nhận trong giờ làm việc. Trang này tự cập nhật.</div>
   <button class="btn" type="button" data-a="check" data-code="${esc(code)}">Tôi đã chuyển khoản · kiểm tra</button>
  </div></div>`);
  const tick=async()=>{const {data}=await sb.rpc("order_status",{p_code:code});const el=$("#pst");if(!el)return;if(data==="Đã thanh toán"){el.outerHTML=`<div class="okbox">Shop đã nhận được tiền. Cảm ơn bạn! Shop sẽ liên hệ để giao đồng hồ.</div>`;clearInterval(poll);poll=null}else if(data==="Huỷ"||data==="Hết hạn"){el.innerHTML=`<span class="err">Đơn ${esc(code)} đã ${data==="Huỷ"?"bị huỷ":"hết hạn giữ hàng"}. Nếu bạn đã chuyển khoản, hãy nhắn shop kèm mã đơn.</span>`}};
  poll=setInterval(tick,20000);
  return tick;
}
document.addEventListener("click",async e=>{
  const t=e.target, a=t.closest("[data-a]")?.dataset.a;
  const g=t.closest("[data-g]");if(g){gi=Number(g.dataset.g);detail(decodeURIComponent(location.hash.slice(1)),true);return}
  const cp=t.closest("[data-copy]");if(cp){try{await navigator.clipboard.writeText(cp.dataset.copy);toast("Đã chép")}catch(err){toast(cp.dataset.copy)}return}
  if(!a)return;const id=decodeURIComponent(location.hash.slice(1));const w=ITEMS.find(x=>x.id===id);
  if(a==="home")goHome();
  else if(a==="prev"||a==="next"){const n=(w.photos||[]).length;gi=(gi+(a==="next"?1:-1)+n)%n;detail(id,true)}
  else if(a==="buy")buyForm(id);
  else if(a==="back")detail(t.closest("[data-a]").dataset.id);
  else if(a==="check"){const b=t.closest("button");b.disabled=true;const {data}=await sb.rpc("order_status",{p_code:b.dataset.code});b.disabled=false;
    const el=$("#pst");if(data==="Đã thanh toán"){if(el)el.outerHTML=`<div class="okbox">Shop đã nhận được tiền. Cảm ơn bạn! Shop sẽ liên hệ để giao đồng hồ.</div>`}else if(el)el.innerHTML="Shop chưa xác nhận khoản chuyển — thường trong vài phút đến vài giờ (giờ làm việc). Bạn cứ để trang này mở, hoặc nhắn shop kèm mã đơn.";}
});
document.addEventListener("submit",async e=>{
  e.preventDefault();const f=e.target;if(f.id!=="bf")return;const b=f.querySelector("button[type=submit]");b.disabled=true;$("#berr").textContent="";
  const fd=new FormData(f);const id=f.dataset.id;
  const {data,error}=await sb.rpc("place_order",{p_watch:id,p_name:fd.get("name"),p_phone:fd.get("phone"),p_address:fd.get("address"),p_note:fd.get("note")});
  if(error){$("#berr").textContent=(error.message||"Không đặt được").replace(/^.*?:\s*/,"");b.disabled=false;load();return}
  const w=ITEMS.find(x=>x.id===id);if(w)w.avail="held";render();
  payView(id,data.code,data.amount);
});
["q","fb","so"].forEach(i=>$("#"+i).addEventListener(i==="q"?"input":"change",render));
addEventListener("hashchange",route);addEventListener("keydown",e=>{if(e.key==="Escape")goHome()});
function route(){const id=decodeURIComponent(location.hash.slice(1));if(id&&ITEMS.find(x=>x.id===id))detail(id);else{closeM();document.title="TimelessTouch · Đồng hồ vintage Nhật"}}
async function load(){
  const {data,error}=await sb.from("shop_watches").select("*");if(error){$("#list").innerHTML=`<div class="empty" style="grid-column:1/-1">Không tải được danh sách. Bạn thử tải lại trang.</div>`;return}
  ITEMS=(data||[]).map(w=>({...w,photos:Array.isArray(w.photos)?w.photos:[],accessories:Array.isArray(w.accessories)?w.accessories:[],list_price:Number(w.list_price)||0}));
  const br=[...new Set(ITEMS.map(w=>w.brand).filter(Boolean))].sort();const cur=$("#fb").value;$("#fb").innerHTML=`<option value="">Mọi hãng</option>`+br.map(b=>`<option${b===cur?" selected":""}>${esc(b)}</option>`).join("");
  render();
}
(async()=>{socials();
  if(!C.SUPABASE_URL||!C.SUPABASE_ANON_KEY){$("#list").innerHTML=`<div class="empty" style="grid-column:1/-1">Shop đang cập nhật, bạn quay lại sau nhé.</div>`;return}
  sb=window.supabase.createClient(C.SUPABASE_URL,C.SUPABASE_ANON_KEY,{auth:{persistSession:false}});
  await load();route();
  try{const o=JSON.parse(localStorage.getItem("tt_last_order")||"null");if(o&&Date.now()-o.t<3*36e5&&!location.hash){const {data}=await sb.rpc("order_status",{p_code:o.code});if(data==="Chờ thanh toán"){const tk=payView(o.id,o.code,o.amount);tk()}}}catch(e){}
})();
</script>
</body>
